name: Auto-create release
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main

jobs:
  create_release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Upsert release pull request
        shell: pwsh
        run: ./Scripts/CreateRelease.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.CREATE_RELEASE_PAT }}
